name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to attach artifacts to"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  release:
    name: Windows build
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Download FFmpeg sidecars
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $binDir = "src-tauri/binaries"
          New-Item -ItemType Directory -Force -Path $binDir | Out-Null
          $zipPath = Join-Path $env:RUNNER_TEMP "ffmpeg-release-essentials.zip"
          $extractDir = Join-Path $env:RUNNER_TEMP "ffmpeg-extract"
          $sources = @(
            "https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip",
            "https://github.com/GyanD/codexffmpeg/releases/download/9.1/ffmpeg-9.1-essentials_build.zip"
          )
          $downloaded = $false
          foreach ($source in $sources) {
            if ($downloaded) { break }
            for ($attempt = 1; $attempt -le 3; $attempt++) {
              try {
                Write-Host "Downloading $source (attempt $attempt)"
                Invoke-WebRequest -Uri $source -OutFile $zipPath
                $downloaded = $true
                break
              } catch {
                Write-Host "Download failed: $($_.Exception.Message)"
                if ($attempt -lt 3) { Start-Sleep -Seconds 15 }
              }
            }
          }
          if (-not $downloaded) {
            throw "Could not download the FFmpeg archive from any source"
          }
          if (Test-Path $extractDir) { Remove-Item -Recurse -Force $extractDir }
          Expand-Archive -Path $zipPath -DestinationPath $extractDir -Force
          $ffmpeg = Get-ChildItem -Path $extractDir -Recurse -Filter "ffmpeg.exe" | Select-Object -First 1
          $ffprobe = Get-ChildItem -Path $extractDir -Recurse -Filter "ffprobe.exe" | Select-Object -First 1
          if (-not $ffmpeg -or -not $ffprobe) {
            throw "ffmpeg.exe or ffprobe.exe not found in downloaded archive"
          }
          $ffmpegOut = Join-Path $binDir "ffmpeg-x86_64-pc-windows-msvc.exe"
          $ffprobeOut = Join-Path $binDir "ffprobe-x86_64-pc-windows-msvc.exe"
          Copy-Item -Path $ffmpeg.FullName -Destination $ffmpegOut -Force
          Copy-Item -Path $ffprobe.FullName -Destination $ffprobeOut -Force
          foreach ($file in @($ffmpegOut, $ffprobeOut)) {
            if (-not (Test-Path $file)) {
              throw "Missing sidecar binary: $file"
            }
            $sizeBytes = (Get-Item $file).Length
            if ($sizeBytes -le 10MB) {
              throw "Sidecar binary too small ($sizeBytes bytes): $file"
            }
            Write-Host "Verified $file ($sizeBytes bytes)"
          }

      - name: Build Windows app and updater artifacts
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        with:
          tauriScript: bun run tauri
          tagName: ${{ inputs.tag || (startsWith(github.ref, 'refs/tags/') && github.ref_name || '') }}
          releaseName: ${{ inputs.tag && format('Glint {0}', inputs.tag) || (startsWith(github.ref, 'refs/tags/') && format('Glint {0}', github.ref_name) || '') }}
          releaseDraft: true
          prerelease: false
